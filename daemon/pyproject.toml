[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deckhand-daemon"
version = "0.1.0"
description = "PC-side daemon for Deckhand: owner-defined actions, process control and telemetry over an authenticated WebSocket."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Deckhand contributors" }]
keywords = ["remote-control", "websocket", "lan", "developer-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=13.0",
    "pydantic>=2.8",
    "PyYAML>=6.0.2",
    "psutil>=6.0",
    "zeroconf>=0.132",
    "cryptography>=43.0",
    "platformdirs>=4.2",
    "typer>=0.12",
    "qrcode>=7.4",
    "Pillow>=10.4",
    "pystray>=0.19",
    "filelock>=3.15",
    "httpx>=0.27",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.560.30"]
pty = [
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
]

[project.scripts]
deckhand = "deckhand.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckhand"]

[tool.hatch.build.targets.sdist]
include = ["src/deckhand", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "mypy>=1.11",
    "ruff>=0.6.2",
    "import-linter>=2.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "pre-commit>=3.8",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "S101",  # assert is fine in tests (also enforced by per-file ignores below)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests assert, use literal fake tokens, and shell out to pytest/uv tooling with
# fixed argv.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
mypy_path = "src"
files = ["src", "tests"]
exclude = ["src/deckhand/tray/assets"]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "posix: tests that only run on POSIX platforms",
    "windows: tests that only run on Windows",
    "integration: tests that start a real server or real subprocesses",
]

# ── coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["deckhand"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── bandit ────────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

# ── import-linter (SRD 3.3) ───────────────────────────────────────────────────
# Layer 0: core, config, platform
# Layer 1: protocol
# Layer 2: security, actions, process, status, telemetry, alerts, layout, discovery
# Layer 3: transport
# Layer 4 (edges): cli, tray, control, bootstrap

[tool.importlinter]
root_packages = ["deckhand"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Daemon layering: edges -> transport -> domain services -> protocol -> foundations"
type = "layers"
layers = [
    "deckhand.cli | deckhand.tray | deckhand.control | deckhand.bootstrap",
    "deckhand.transport",
    "deckhand.security | deckhand.actions | deckhand.process | deckhand.status | deckhand.telemetry | deckhand.alerts | deckhand.layout | deckhand.discovery",
    "deckhand.protocol",
    "deckhand.core | deckhand.config | deckhand.platform",
]

# Allowed cross-service imports only: actions -> process, status -> process, alerts -> telemetry.

[[tool.importlinter.contracts]]
name = "security does not import other domain services"
type = "forbidden"
source_modules = ["deckhand.security"]
forbidden_modules = [
    "deckhand.actions",
    "deckhand.process",
    "deckhand.status",
    "deckhand.telemetry",
    "deckhand.alerts",
    "deckhand.layout",
    "deckhand.discovery",
]

[[tool.importlinter.contracts]]
name = "actions may import process only"
type = "forbidden"
source_modules = ["deckhand.actions"]
forbidden_modules = [
    "deckhand.security",
    "deckhand.status",
    "deckhand.telemetry",
    "deckhand.alerts",
    "deckhand.layout",
    "deckhand.discovery",
]

[[tool.importlinter.contracts]]
name = "process does not import other domain services"
