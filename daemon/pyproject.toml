source_modules = ["deckhand.process"]
forbidden_modules = [
    "deckhand.security",
    "deckhand.actions",
    "deckhand.status",
    "deckhand.telemetry",
    "deckhand.alerts",
    "deckhand.layout",
    "deckhand.discovery",
]

[[tool.importlinter.contracts]]
name = "status may import process only"
type = "forbidden"
source_modules = ["deckhand.status"]
forbidden_modules = [
    "deckhand.security",
    "deckhand.actions",
    "deckhand.telemetry",
    "deckhand.alerts",
    "deckhand.layout",
