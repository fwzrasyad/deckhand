# Analysis configuration for the Deckhand mobile app (SRD 0.1 rule 9).
#
# very_good_analysis is deliberately strict: it enables
# `public_member_api_docs`, so every public type, member, and top-level
# function in lib/ carries a doc comment.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Generated code is checked as part of the build, not hand-maintained here.
    missing_required_param: error
    missing_return: error
    todo: info

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"
    - "build/**"

linter:
  rules:
    # The app must never print secrets; use the logger in core/logging instead.
    avoid_print: true
    # Prefer explicit types at API boundaries even though Dart infers them.
    always_declare_return_types: true
    # Resource leaks are hard to spot in widget code; enforce try/finally use.
    cancel_subscriptions: true
    close_sinks: true
    # Security: no dynamic invocation in shipping code (SRD 4.2 T5).
    avoid_dynamic_calls: true
