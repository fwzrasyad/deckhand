name: Feature Request
description: Suggest a new feature or improvement for Deckhand
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please read the non-goals in the
        SRD (Section 1.3) before submitting. This is a local-first,
        privacy-respecting tool — we do not plan to add cloud features,
        accounts, or analytics.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the feature.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: What problem does this solve? Which scenario from the SRD does it improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the feature in detail. If it touches the protocol, describe
        the new message types or fields.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: non-goals
    attributes:
      label: Non-goals check
      options:
        - label: This feature does not require cloud infrastructure, accounts, or internet access.
          required: true
        - label: This feature does not weaken any security requirement (SEC-*).
          required: true
