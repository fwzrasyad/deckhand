name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-daemon:
    name: Build daemon on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: daemon
        run: pip install -e ".[dev]"

      - name: Build PyInstaller bundle
        working-directory: daemon
        run: pyinstaller packaging/pyinstaller.spec

      - name: Generate SHA256SUMS
        working-directory: daemon/dist
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            Get-FileHash * | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File SHA256SUMS
          else
            sha256sum * > SHA256SUMS
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.os }}
          path: daemon/dist/

  build-mobile:
    name: Build mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build AAB
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-daemon, build-mobile]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: true
